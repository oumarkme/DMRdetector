name: Build and push container image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SIF_NAME: dmrdetector.sif

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image names
        id: image_names
        run: |
          image_name_lc="$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "docker_image=${REGISTRY}/${image_name_lc}" >> "${GITHUB_OUTPUT}"
          echo "apptainer_image=${REGISTRY}/${image_name_lc}-apptainer" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_names.outputs.docker_image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          apptainer --version

      - name: Log in to GHCR for Apptainer
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login --username "${{ github.actor }}" --password-stdin docker://${{ env.REGISTRY }}
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login --username "${{ github.actor }}" --password-stdin oras://${{ env.REGISTRY }}

      - name: Build and push Apptainer SIF
        id: apptainer
        env:
          DOCKER_TAGS: ${{ steps.meta.outputs.tags }}
          APPTAINER_IMAGE: ${{ steps.image_names.outputs.apptainer_image }}
        run: |
          set -euo pipefail

          source_image="$(printf '%s\n' "${DOCKER_TAGS}" | sed '/^[[:space:]]*$/d' | head -n 1)"
          if [ -z "${source_image}" ]; then
            echo "No Docker tag was generated; cannot build Apptainer image." >&2
            exit 1
          fi

          apptainer pull --force "${SIF_NAME}" "docker://${source_image}"
          apptainer inspect "${SIF_NAME}"

          printf '%s\n' "${DOCKER_TAGS}" | while IFS= read -r docker_tag; do
            [ -n "${docker_tag}" ] || continue
            tag="${docker_tag##*:}"
            apptainer push --allow-unsigned "${SIF_NAME}" "oras://${APPTAINER_IMAGE}:${tag}"
          done

          echo "sif_name=${SIF_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload Apptainer SIF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apptainer.outputs.sif_name }}
          path: ${{ steps.apptainer.outputs.sif_name }}
          if-no-files-found: error

      - name: Attach Apptainer SIF to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.apptainer.outputs.sif_name }}" --clobber
