name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  install-and-smoke:
    name: env create + smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]   # macos-latest disabled — EnsDb is x86_64 only
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up miniforge + dmrdetector env
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: dmrdetector
          environment-file: environment.yml
          auto-activate-base: false

      - name: Verify install
        run: bash bin/check_install.sh

      - name: Smoke test
        run: bash test/smoke/run_smoke.sh
